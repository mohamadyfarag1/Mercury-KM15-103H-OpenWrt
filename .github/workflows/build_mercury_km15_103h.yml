name: Build Custom OpenWrt for Mercury KM15-103H

# Re-trigger build on public repository
on:
  push:
    paths:
      - 'mercury_km15_103h_build/**'
      - 'scripts/**'
      - 'package/**'
      - '.github/workflows/build_mercury_km15_103h.yml'
  workflow_dispatch:
    inputs:
      enable_23ghz:
        description: 'EXPERIMENTAL: add 2.3 GHz channels (2312-2402 MHz) on the 2.4 GHz radio. The MT7915E RF front end is built for 2.4 GHz and has no calibration below it, so these may not radiate - measure on the device before trusting. Off = the stable standard build.'
        type: boolean
        required: false
        default: false
      enable_outband:
        description: 'EXPERIMENTAL: feed the MCU the raw centre frequency (outband_freq) so it may beacon on non-standard 5 GHz channels it otherwise refuses. Undocumented vendor field - may not work or may time out the MCU. Bench-test only.'
        type: boolean
        required: false
        default: false

# Two pushes in quick succession would otherwise run two full ~35 minute
# builds against the same cache, uploading two artifacts with the same
# name where the second finishes wins regardless of which commit it built.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OpenWrt for Mercury KM15-103H
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Linux Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo find /etc/apt/ -type f -exec sed -i 's/azure.archive.ubuntu.com/mirrors.kernel.org/g' {} + 2>/dev/null || true
          sudo find /etc/apt/ -type f -exec sed -i 's/archive.ubuntu.com/mirrors.kernel.org/g' {} + 2>/dev/null || true
          sudo find /etc/apt/ -type f -exec sed -i 's/security.ubuntu.com/mirrors.kernel.org/g' {} + 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true -o Acquire::Retries=3 \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-distutils python3-setuptools rsync unzip zlib1g-dev \
            file wget device-tree-compiler python3-pip python3-m2crypto swig libelf-dev ccache

      # Cache the OpenWrt source package downloads across runs.
      # Key includes the config hash so adding/removing packages busts the cache.
      # restore-keys lets a partial cache hit still skip most re-downloads.
      - name: Cache OpenWrt downloads (dl/)
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ hashFiles('scripts/mercury-04-configure.sh', 'scripts/mercury-05-compile.sh') }}
          restore-keys: |
            openwrt-dl-

      # ccache wraps gcc/g++ transparently; saves ~40 min on subsequent builds
      # when only a small part of the tree changed (e.g. a script or config tweak).
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 5G
          key: openwrt-ccache-ramips-mt7621
          restore-keys: |
            openwrt-ccache-ramips-mt7621

      - name: Clone OpenWrt Source
        run: |
          # The "Cache OpenWrt downloads" step above restores into openwrt/dl,
          # which creates the openwrt/ directory as a side effect on any cache
          # hit (including a restore-keys prefix match). `git clone` refuses to
          # clone into a non-empty directory, so clone into a temp dir and
          # merge - this preserves the restored dl/ cache instead of wiping it.
          if [ -d openwrt ] && [ -n "$(ls -A openwrt 2>/dev/null)" ]; then
            echo "openwrt/ already exists (cache restore) - cloning to temp and merging"
            git clone --depth 1 --branch v24.10.2 https://git.openwrt.org/openwrt/openwrt.git openwrt-clone-tmp
            cp -a openwrt-clone-tmp/. openwrt/
            rm -rf openwrt-clone-tmp
          else
            git clone --depth 1 --branch v24.10.2 https://git.openwrt.org/openwrt/openwrt.git openwrt
          fi
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Setup Device Tree
        run: bash scripts/mercury-01-setup-dts.sh

      - name: Patch Makefiles and Device Target
        run: bash scripts/mercury-02-patch-makefiles.sh

      - name: Patch Platform for Safe Dual-Slot Sysupgrade
        run: bash scripts/mercury-03-patch-platform.sh

      - name: Configure OpenWrt
        env:
          # The 2.3 GHz hostapd freq-mapping patch is written only when set.
          MERCURY_ENABLE_23GHZ: ${{ inputs.enable_23ghz && '1' || '' }}
        run: bash scripts/mercury-04-configure.sh

      - name: Download Build Dependencies
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware (regdb + precal fallback + build + verify)
        env:
          # Empty unless the run was dispatched with the 2.3 GHz box ticked.
          # gen_mt7915_23ghz_patch.py, the util.c cast and mercury-06 read it.
          MERCURY_ENABLE_23GHZ: ${{ inputs.enable_23ghz && '1' || '' }}
          # Empty unless the outband experiment box was ticked.
          MERCURY_ENABLE_OUTBAND: ${{ inputs.enable_outband && '1' || '' }}
        run: bash scripts/mercury-05-compile.sh

      # What actually shipped, on the run page instead of buried in the
      # compile log. The checksums are the ones to compare after downloading
      # the artifact - a truncated download flashes as willingly as a good
      # image and only fails once it is on the device.
      - name: Release summary
        if: success()
        run: |
          OUT=openwrt/bin/targets/ramips/mt7621
          {
            echo "## Mercury KM15-103H firmware built"
            echo
            echo "commit \`${GITHUB_SHA:0:12}\` on \`${GITHUB_REF_NAME}\`"
            echo
            echo "| image | size | sha256 |"
            echo "|---|---|---|"
            for f in "$OUT"/*mercury_km15-103h*.bin; do
              [ -f "$f" ] || continue
              printf '| %s | %s | `%s` |\n' \
                "$(basename "$f")" \
                "$(du -h "$f" | cut -f1)" \
                "$(sha256sum "$f" | cut -c1-16)..."
            done
            echo "1. Initial Install: Flash \`*-squashfs-factory.bin\` directly via Breed Web GUI (192.168.1.1)."
            echo "2. Routine Upgrades: Flash \`*-squashfs-sysupgrade.bin\` via LuCI (without \"Keep settings\")."
            echo "Then run \`mercury-wifi-check\` over SSH to confirm the MT7915 radios came up."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Emergency Backup Upload to Transfer.sh (Bypass GitHub Storage Limit)
        if: success()
        run: |
          echo "## Backup Download Links (transfer.sh)" >> "$GITHUB_STEP_SUMMARY"
          echo "In case the GitHub Artifact upload fails due to 403 Storage Quota Exceeded, use these links:" >> "$GITHUB_STEP_SUMMARY"
          for f in openwrt/bin/targets/ramips/mt7621/*mercury_km15-103h*sysupgrade.bin; do
            [ -f "$f" ] || continue
            FILENAME=$(basename "$f")
            URL=$(curl -s -T "$f" "https://transfer.sh/$FILENAME")
            echo "- **Firmware**: [$FILENAME]($URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "Uploaded backup to $URL"
          done

      - name: Upload Flashable Firmware Artifact
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Mercury_KM15-103H_Firmware
          path: |
            openwrt/bin/targets/ramips/mt7621/*mercury_km15-103h*.bin
            openwrt/bin/targets/ramips/mt7621/*.manifest
            openwrt/bin/targets/ramips/mt7621/sha256sums
          if-no-files-found: warn
          retention-days: 2
          compression-level: 9

      # Recovery artifact: *-initramfs-uImage.itb + instructions.
      # A FIT image U-Boot can 'bootm' straight into RAM, same idea as the
      # ipq40xx .itb builds. No u-boot.bin is shipped: OpenWrt has no U-Boot
      # package for ramips/mt7621 at all, so the bootloader must be dumped
      # off the device (dd if=/dev/mtd0) - see recovery_files/HOW_TO_USE.txt.
      # Use when: first install, device bricked, or flashing from a clean NAND.
      - name: Upload UART Recovery Files (initramfs + instructions)
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Mercury_KM15-103H_UART_Recovery
          path: recovery_files/
          if-no-files-found: warn
          retention-days: 2

      # A failed build still leaves partial images on disk. Ship only the
      # build log so that a rejected image can never accidentally be flashed.
      - name: Upload build log only (build or verification failed)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: FAILED-BUILD-LOG-DO-NOT-FLASH
          path: |
            openwrt/build.log
            openwrt/logs/
          if-no-files-found: warn
          retention-days: 2
