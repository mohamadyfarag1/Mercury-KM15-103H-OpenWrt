name: Build Custom OpenWrt for Mercury KM15-103H (HE160 Superchannel)

on:
  push:
    paths:
      - 'mercury_km15_103h_build/**'
      - 'scripts/mercury-*.sh'
      - 'scripts/gen_mt76_patch.py'
      - '.github/workflows/build_mercury_km15_103h.yml'
  workflow_dispatch:
    inputs:
      enable_23ghz:
        description: 'Add EXPERIMENTAL 2.3 GHz channels (2312-2402 MHz). The MT7915E RF front end is built for 2.4 GHz and has no calibration below it - these may not radiate. Measure before trusting.'
        type: boolean
        required: false
        default: false

# Two pushes in quick succession would otherwise run two full ~35 minute
# builds against the same cache, uploading two artifacts with the same
# name where the second finishes wins regardless of which commit it built.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OpenWrt for Mercury KM15-103H
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Linux Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo find /etc/apt/ -type f -exec sed -i 's/azure.archive.ubuntu.com/mirrors.kernel.org/g' {} + 2>/dev/null || true
          sudo find /etc/apt/ -type f -exec sed -i 's/archive.ubuntu.com/mirrors.kernel.org/g' {} + 2>/dev/null || true
          sudo find /etc/apt/ -type f -exec sed -i 's/security.ubuntu.com/mirrors.kernel.org/g' {} + 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get update -o Acquire::ForceIPv4=true -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true -o Acquire::Retries=3 \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-distutils python3-setuptools rsync unzip zlib1g-dev \
            file wget device-tree-compiler python3-pip python3-m2crypto swig libelf-dev

      - name: Clone OpenWrt Source
        run: |
          git clone --depth 1 --branch v24.10.2 https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Setup Device Tree
        run: bash scripts/mercury-01-setup-dts.sh

      - name: Patch Makefiles and Device Target
        run: bash scripts/mercury-02-patch-makefiles.sh

      - name: Patch Platform for Safe Dual-Slot Sysupgrade
        run: bash scripts/mercury-03-patch-platform.sh

      - name: Configure OpenWrt
        run: bash scripts/mercury-04-configure.sh

      - name: Download Build Dependencies
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware (regdb + superchannel patches + build + verify)
        env:
          # Empty unless the run was dispatched with the 2.3 GHz box ticked.
          # gen_mt76_patch.py and mercury-07-superchannel.sh both read this.
          MERCURY_ENABLE_23GHZ: ${{ inputs.enable_23ghz && '1' || '' }}
        run: bash scripts/mercury-05-compile.sh

      # What actually shipped, on the run page instead of buried in the
      # compile log. The checksums are the ones to compare after downloading
      # the artifact - a truncated download flashes as willingly as a good
      # image and only fails once it is on the device.
      - name: Release summary
        if: success()
        run: |
          OUT=openwrt/bin/targets/ramips/mt7621
          {
            echo "## Mercury KM15-103H firmware built"
            echo
            echo "commit \`${GITHUB_SHA:0:12}\` on \`${GITHUB_REF_NAME}\`"
            echo
            echo "| image | size | sha256 |"
            echo "|---|---|---|"
            for f in "$OUT"/*mercury_km15-103h*.bin; do
              [ -f "$f" ] || continue
              printf '| %s | %s | `%s` |\n' \
                "$(basename "$f")" \
                "$(du -h "$f" | cut -f1)" \
                "$(sha256sum "$f" | cut -c1-16)..."
            done
            echo
            echo "Flash \`*-squashfs-sysupgrade.bin\` **without** \"Keep settings\","
            echo "then run \`mercury-wifi-check\` over SSH to confirm the radios came up."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Flashable Firmware Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mercury_KM15-103H_SuperFirmware_HE160
          path: |
            openwrt/bin/targets/ramips/mt7621/*mercury_km15-103h*sysupgrade.bin
            openwrt/bin/targets/ramips/mt7621/*mercury_km15-103h*.manifest
            openwrt/bin/targets/ramips/mt7621/sha256sums
          if-no-files-found: error

      # Recovery artifact: u-boot.bin + initramfs-kernel.bin + instructions.
      # Use when: device is bricked OR you want to flash from a clean NAND state.
      # Procedure: short NAND Pin 9 (#CE) -> Ymodem u-boot.bin -> loady -> bootm
      # -> OpenWrt in RAM -> sysupgrade -n sysupgrade.bin
      # See recovery_files/HOW_TO_USE.txt for full step-by-step instructions.
      - name: Upload UART Recovery Files (u-boot + initramfs + instructions)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mercury_KM15-103H_UART_Recovery
          path: recovery_files/
          if-no-files-found: warn

      # A failed build still leaves partial images on disk. Ship only the
      # build log so that a rejected image can never accidentally be flashed.
      - name: Upload build log only (build or verification failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FAILED-BUILD-LOG-DO-NOT-FLASH
          path: |
            openwrt/build.log
            openwrt/logs/
          if-no-files-found: warn
